name: rhythm_flutter
description: "A multi-language Flutter app with Riverpod state management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  collection: ^1.18.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  dio: ^5.9.1
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_dotenv: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/rhythm_icon.png"

flutter_native_splash:
  color: "#6C5CE7"
  android: true
  ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/icon/rhythm_icon.png

